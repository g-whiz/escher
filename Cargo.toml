[workspace]
resolver = "3"
members = [
    "crates/escher-cli",
    "crates/escher-domain",
    "crates/escher-geometry",
    "crates/escher-group",
    "crates/escher-reference",
    "crates/escher-render",
    "crates/escher-signature",
]

[workspace.package]
authors = ["George Gianacopoulos <gpg.software@gmail.com>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/g-whiz/escher"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.103"
astro-float-num = { version = "0.3.7", default-features = false, features = [
    "std",
] }
clap = { version = "4.6", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
escher-domain = { version = "0.1.0", path = "crates/escher-domain" }
escher-geometry = { version = "0.1.0", path = "crates/escher-geometry" }
escher-group = { version = "0.1.0", path = "crates/escher-group" }
escher-reference = { version = "0.1.0", path = "crates/escher-reference" }
escher-render = { version = "0.1.0", path = "crates/escher-render" }
escher-signature = { version = "0.1.0", path = "crates/escher-signature" }
glam = { version = "0.34.3", default-features = false, features = [
    "float-types",
    "std",
] }
insta = { version = "1.49", default-features = false }
png = "0.18.1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rayon = "1.12.0"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
elided_lifetimes_in_paths = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
ffi_unwind_calls = "warn"
ambiguous_negative_literals = "warn"
redundant_imports = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
mem_forget = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

exhaustive_enums = "warn"
exhaustive_structs = "warn"
partial_pub_fields = "warn"
mod_module_files = "warn"

# The tests render whole images, which is slow without optimization.
# Dependencies stay unoptimized, which keeps a clean build short.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 0

# The high-precision arithmetic of the reference tests is too slow to run without optimization.
[profile.dev.package.astro-float-num]
opt-level = 3
